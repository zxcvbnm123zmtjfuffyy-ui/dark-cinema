<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Cinema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #0f0c29;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 2rem;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { text-align: center; color: #5865F2; margin-bottom: .2rem; }
        .sub { text-align: center; opacity: .5; font-size: .85rem; margin-bottom: 1.5rem; }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            margin-bottom: 1rem;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .no-video {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #666;
            font-size: 1.2rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
            justify-content: center;
            margin-bottom: 1rem;
        }
        button {
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: .9rem;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            color: #fff;
            background: #5865F2;
            flex: 0 1 auto;
            min-width: 70px;
        }
        button:hover:not(:disabled) { filter: brightness(1.15); transform: scale(1.02); }
        button:disabled { opacity: .35; cursor: not-allowed; transform: none; }
        .btn-danger { background: #da373c; }
        .btn-danger:hover:not(:disabled) { filter: brightness(1.15); }
        .btn-success { background: #23a55a; }
        .btn-success:hover:not(:disabled) { filter: brightness(1.15); }

        .status-bar {
            display: flex;
            align-items: center;
            gap: .6rem;
            background: rgba(255,255,255,.05);
            border-radius: 12px;
            padding: .7rem 1rem;
            margin-bottom: 1rem;
            font-size: .85rem;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ED4245;
            flex-shrink: 0;
        }
        .dot.live { background: #57F287; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

        .logs {
            background: #0a0a14;
            border-radius: 16px;
            padding: .8rem 1rem;
            font-family: monospace;
            font-size: .74rem;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.7;
        }
        .log-time { opacity: .35; margin-left: .4rem; }
        .log-ok   { color: #57F287; }
        .log-err  { color: #ED4245; }
        .log-warn { color: #faa81a; }
    </style>
</head>
<body>
<div class="card">
    <h1>🎬 Dark Cinema</h1>
    <div class="sub">بث مباشر إلى ديسكورد</div>

    <div class="video-container">
        <video id="videoPlayer" controls></video>
    </div>

    <div class="controls">
        <button id="playBtn" class="btn-success">▶ تشغيل</button>
        <button id="pauseBtn">⏸ إيقاف</button>
        <button id="seekBack">⏪ -10s</button>
        <button id="seekForward">⏩ +10s</button>
        <button id="broadcastStart" class="btn-success">📡 بدء البث</button>
        <button id="broadcastStop" class="btn-danger">⏹ إيقاف البث</button>
    </div>

    <div class="status-bar">
        <div class="dot" id="dot"></div>
        <span id="statusText">غير متصل</span>
        <span style="margin-right:auto; opacity:.5;">👥 <span id="viewers">0</span></span>
    </div>

    <div class="logs" id="logs"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const video = document.getElementById('videoPlayer');
let isPlaying = false;
let isSyncing = false;

function log(msg, type = '') {
    const div = document.getElementById('logs');
    const line = document.createElement('div');
    const t = new Date().toLocaleTimeString('ar');
    line.innerHTML = `<span class="log-time">${t}</span> ${msg}`;
    if (type) line.className = 'log-' + type;
    div.appendChild(line);
    div.scrollTop = div.scrollHeight;
    while (div.children.length > 50) div.removeChild(div.firstChild);
}

function setStatus(text, state = '') {
    document.getElementById('statusText').textContent = text;
    document.getElementById('dot').className = 'dot' + (state ? ' ' + state : '');
}

async function loadVideo() {
    try {
        const res = await fetch('/api/video');
        const data = await res.json();
        if (data.exists) {
            video.src = '/video/episode.mp4';
            video.load();
            log('📹 تم تحميل الحلقة', 'ok');
        } else {
            log('⚠️ لا يوجد فيديو في مجلد video/', 'warn');
        }
    } catch (e) { log('❌ ' + e.message, 'err'); }
}
loadVideo();

document.getElementById('playBtn').onclick = () => {
    if (video.paused) {
        video.play();
        socket.emit('play');
    }
};

document.getElementById('pauseBtn').onclick = () => {
    if (!video.paused) {
        video.pause();
        socket.emit('pause');
    }
};

document.getElementById('seekBack').onclick = () => {
    const t = Math.max(0, video.currentTime - 10);
    video.currentTime = t;
    socket.emit('seek', t);
};

document.getElementById('seekForward').onclick = () => {
    const t = Math.min(video.duration, video.currentTime + 10);
    video.currentTime = t;
    socket.emit('seek', t);
};

document.getElementById('broadcastStart').onclick = async () => {
    log('📡 بدء البث إلى ديسكورد...');
    document.getElementById('broadcastStart').disabled = true;
    try {
        const res = await fetch('/api/broadcast/start', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            log('✅ ' + data.message, 'ok');
            setStatus('يبث الآن', 'live');
        } else {
            log('❌ ' + data.message, 'err');
            setStatus('فشل البث');
        }
    } catch (e) { log('❌ ' + e.message, 'err'); }
    document.getElementById('broadcastStart').disabled = false;
};

document.getElementById('broadcastStop').onclick = async () => {
    log('⏹ إيقاف البث...');
    try {
        const res = await fetch('/api/broadcast/stop', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            log('🛑 ' + data.message, 'warn');
            setStatus('متوقف');
        } else {
            log('⚠️ ' + data.message, 'warn');
        }
    } catch (e) { log('❌ ' + e.message, 'err'); }
};

socket.on('sync', ({ currentTime, isPlaying: playing }) => {
    if (!isSyncing) {
        video.currentTime = currentTime;
        if (playing && video.paused) video.play();
        if (!playing && !video.paused) video.pause();
    }
});

socket.on('play', (time) => {
    video.currentTime = time;
    if (video.paused) video.play();
});

socket.on('pause', (time) => {
    video.currentTime = time;
    if (!video.paused) video.pause();
});

socket.on('seek', (time) => {
    video.currentTime = time;
});

socket.on('broadcast-status', (data) => {
    log(data.success ? '✅ ' + data.message : '❌ ' + data.message, data.success ? 'ok' : 'err');
    if (data.success) setStatus('يبث الآن', 'live');
});

socket.on('connect', () => {
    log('🔗 متصل بالسيرفر', 'ok');
});

socket.on('disconnect', () => {
    log('🔌 انقطع الاتصال', 'err');
});

video.addEventListener('play', () => {
    if (!isSyncing) { isPlaying = true; socket.emit('play', video.currentTime); }
});

video.addEventListener('pause', () => {
    if (!isSyncing) { isPlaying = false; socket.emit('pause', video.currentTime); }
});

video.addEventListener('seeked', () => {
    if (!isSyncing) socket.emit('seek', video.currentTime);
});

socket.on('viewers', (count) => {
    document.getElementById('viewers').textContent = count;
});

log('🚀 Dark Cinema جاهزة');
setStatus('جاهز');
</script>
</body>
</html>
