services:
  - type: web
    name: dark-cinema
    env: node
    plan: free
    buildCommand: "apt-get update -y && apt-get install -y ffmpeg && npm install"
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: PORT
        value: 3000
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
    healthCheckPath: /api/status
